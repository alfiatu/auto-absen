name: Auto Absen Bersamaan

on:
  schedule:
    # Berjalan pada waktu yang sama (misal pukul 04.00 WIB)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  jalankan-semua-absen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # 1. Menjalankan skrip pertama
      - name: Jalankan Absen Subuh
        env:
          NIM_SIMA: ${{ secrets.NIM_SIMA }}
          PASS_SIMA: ${{ secrets.PASS_SIMA }}
        run: |
          python absen-subuh.py

      # 2. Menjalankan skrip kedua (jika ada link/kegiatan lain di waktu yang sama)
      - name: Jalankan Absen Kegiatan Lain
        env:
          NIM_SIMA: ${{ secrets.NIM_SIMA }}
          PASS_SIMA: ${{ secrets.PASS_SIMA }}
        run: |
          python absen-kedua.py
