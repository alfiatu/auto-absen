name: Auto Absen SIMA

on:
  schedule:
    # Berjalan setiap hari pukul 04.00 WIB (21.00 UTC hari sebelumnya)
    - cron: '0 21 * * *'
  workflow_dispatch: # Tombol untuk menjalankan secara manual dari tab Actions

jobs:
  absen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Automation Script
        env:
          NIM_SIMA: ${{ secrets.NIM_SIMA }}
          PASS_SIMA: ${{ secrets.PASS_SIMA }}
        run: |
          python absen-subuh.py
