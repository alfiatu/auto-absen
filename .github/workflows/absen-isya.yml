name: Auto Absen Malam 20.00 WIB

on:
  schedule:
    # Berjalan setiap hari pukul 20.00 WIB (13.00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # Tombol untuk menjalankan secara manual kapan saja dari tab Actions

jobs:
  jalankan-dua-file-malam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # 1. Menjalankan file skrip pertama (Ganti namanya sesuai file Anda)
      - name: Jalankan File Pertama
        env:
          NIM_SIMA: ${{ secrets.NIM_SIMA }}
          PASS_SIMA: ${{ secrets.PASS_SIMA }}
        run: |
          python absen-isya.py

      # 2. Menjalankan file skrip kedua (Ganti namanya sesuai file Anda)
      - name: Jalankan File Kedua
        env:
          NIM_SIMA: ${{ secrets.NIM_SIMA }}
          PASS_SIMA: ${{ secrets.PASS_SIMA }}
        run: |
          python absensi-isya.py
